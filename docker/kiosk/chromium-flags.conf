# Flag Chromium untuk container kiosk (docker/kiosk/Dockerfile).
# Satu flag per baris, komentar diawali '#'.
#
# Dikalibrasi untuk perangkat RAM kecil (Pi 3 B+ 1 GB / Compute Stick 2 GB):
# satu proses renderer, heap V8 kecil, cache disk kecil. Menambah angka di
# bawah adalah penyebab paling umum layar membeku / container di-OOM-kill.

# --- memori & rendering ---
--renderer-process-limit=1
--enable-low-end-device-mode
--disable-dev-shm-usage
--js-flags=--max-old-space-size=128
--disk-cache-size=33554432
--disable-gpu-program-cache
--disable-software-rasterizer

# --- kurangi trafik & proses latar ---
--disable-background-networking
--disable-component-update
--disable-default-apps
--disable-extensions
--disable-sync
--disable-pinch
--check-for-update-interval=31536000

# --- anti "Google Translate" (panel & DDMS tidak boleh diterjemahkan) ---
--disable-features=Translate,TranslateUI,MediaRouter,OptimizationHints
--lang=id-ID
--accept-lang=id-ID,id
