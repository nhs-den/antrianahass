# Flag Chromium untuk STB Amlogic (S905X, RAM 2 GB) - Armbian/Debian arm64.
# install.sh menyesuaikan dua baris di bawah otomatis sesuai RAM terdeteksi
# (1 renderer / 128 MB bila RAM < 1,8 GB).
#
# Satu flag per baris, komentar diawali '#'. Berkas ini dibaca install.sh lalu
# ditanam sebagai Environment=CHROMIUM_FLAGS di ahass-kiosk.service; setelah
# mengubahnya jalankan: sudo bash /opt/antrianahass/stb/install.sh --no-deps

# --- memori (2 GB: boleh 2 renderer & heap 256 MB) ---
--renderer-process-limit=2
--js-flags=--max-old-space-size=256
--disable-dev-shm-usage
--disk-cache-size=67108864

# --- kurangi proses & trafik latar ---
--disable-background-networking
--disable-component-update
--disable-default-apps
--disable-extensions
--disable-sync
--disable-translate
--disable-pinch
--overscroll-history-navigation=0
--disable-features=Translate,MediaRouter,OptimizationHints,CalculateNativeWinOcclusion,InterestFeedContentSuggestions
--check-for-update-interval=31536000

# --- kiosk & profil ---
--no-first-run
--no-default-browser-check
--noerrdialogs
--disable-infobars
--disable-session-crashed-bubble
--password-store=basic
--use-mock-keychain
--autoplay-policy=no-user-gesture-required
--window-position=0,0

# Catatan S905X:
# - GPU Mali-450 di kernel mainline sering gagal compositing. Kalau layar
#   hitam/berkedip, stb/screen-fix.sh otomatis menambahkan --disable-gpu.
# - Jangan tambahkan --no-sandbox manual; start-kiosk.sh menambahkannya
#   sendiri hanya ketika berjalan sebagai root.
# - --kiosk, --user-data-dir, dan --window-size diisi otomatis oleh launcher.
