# Panel AHASS - penyetelan kecil untuk STB Amlogic (RAM 2 GB).
# Dipasang oleh stb/install.sh.
#
# Ramah untuk eMMC/microSD: kurangi halaman kotor yang menumpuk sebelum ditulis.
vm.dirty_ratio=10
vm.dirty_background_ratio=5

# Cache metadata tidak perlu agresif; Chromium butuh halaman anonim.
vm.vfs_cache_pressure=50

# Kalau zram aktif (disarankan), naikkan ke 100:
#   sudo sysctl vm.swappiness=100
vm.swappiness=60
