# Flag Chromium untuk Raspberry Pi 3 B+ (RAM 1 GB, kartu microSD 16 GB).
# Satu flag per baris, komentar diawali '#'.
#
# Dipakai oleh dua mode:
#   - desktop : dibaca oleh /usr/local/bin/ahass-kiosk-desktop.sh
#   - kiosk   : disalin ke Environment=CHROMIUM_FLAGS di ahass-kiosk.service
#
# Batasi memori: Pi 3 B+ hanya 1 GB, jadi cukup 1 proses renderer dan
# heap V8 kecil. Menambah angka di bawah ini adalah penyebab paling umum
# layar membeku / OOM di Pi 3 B+.

# --- memori & rendering ---
--renderer-process-limit=1
--enable-low-end-device-mode
--disable-dev-shm-usage
--js-flags=--max-old-space-size=128
--disk-cache-size=33554432
--disable-gpu-program-cache

# --- kurangi trafik & proses latar ---
--disable-background-networking
--disable-component-update
--disable-default-apps
--disable-extensions
--disable-sync
--disable-translate
--disable-pinch
--overscroll-history-navigation=0
--disable-features=Translate,MediaRouter,OptimizationHints,CalculateNativeWinOcclusion,InterestFeedContentSuggestions
--check-for-update-interval=31536000

# --- kiosk & keamanan profil ---
--no-first-run
--no-default-browser-check
--noerrdialogs
--disable-infobars
--disable-session-crashed-bubble
--password-store=basic
--use-mock-keychain
--autoplay-policy=no-user-gesture-required
--window-position=0,0

# Catatan Raspberry Pi:
# - Jangan tambahkan --no-sandbox kecuali Chromium menolak start sebagai
#   user non-root; itu melemahkan isolasi proses.
# - Bila layar berkedip atau putih di Pi 3 B+, coba tambahkan baris
#   --disable-gpu  (rendering jadi software, lebih lambat tapi stabil).
# - '--kiosk' dan '--user-data-dir' ditambahkan otomatis oleh launcher,
#   jadi tidak perlu ditulis di sini.
