# Panel AHASS - penyetelan kecil untuk Raspberry Pi 3 B+ (1 GB RAM).
# Dipasang oleh raspberry/install.sh --tweaks (default aktif).

# DietPi memakai zram sebagai swap utama; agresif memindahkan halaman anonim
# ke zram jauh lebih murah daripada menunggu OOM killer membunuh Chromium.
vm.swappiness=100
vm.vfs_cache_pressure=50

# MicroSD lebih lambat dari RAM: kurangi dirty page yang menumpuk.
vm.dirty_ratio=10
vm.dirty_background_ratio=5
