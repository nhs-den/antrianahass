# Flag Chromium untuk STB yang hanya menampilkan panel dari PC.
#
# Di STB-client beban rendering sebenarnya dikerjakan PC? Tidak: Chromium tetap
# merender di STB, jadi flag hemat memori tetap dipakai. Bedanya, halaman datang
# lewat LAN sehingga cache kecil sudah cukup.

# Batasi proses renderer agar RAM STB 1-2 GB tidak habis.
--renderer-process-limit=1
--js-flags=--max-old-space-size=192

# Media sosial / video biasanya paling boros; matikan yang tidak perlu.
--disable-dev-shm-usage
--disk-cache-size=33554432
--media-cache-size=16777216

# Tidak ada audio interaktif / update di belakang layar.
--disable-background-networking
--disable-component-update
--disable-default-apps
--disable-extensions
--disable-sync
--disable-translate

# Layar sentuh / mouse tidak dipakai.
--disable-pinch
--overscroll-history-navigation=0
